{% if chats %}
    <div class="flex gap-10 align-center fd-col">
        {% for chat in chats %}
            <a href="/chat-info?id={{ chat.chat_id }}" class="simple-card hov-scale padd-15-20">
                {{ chat.chat_name }}
            </a>
        {% endfor %}
        {% include 'chats/add-button.html' %}
    </div>
{% else %}
    {% include 'chats/empty-content.html' %}
{% endif %}
